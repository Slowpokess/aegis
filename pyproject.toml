[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegis-research"
version = "0.14.0"
description = "Evidence-driven local AI-assisted security research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "playwright>=1.52,<2",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
aegis = "evals.entrypoint:cli"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "network_integration: requires a real loopback listening socket and Rust executor",
]

[tool.ruff]
target-version = "py312"
line-length = 100
